[workspace]
members = [
  "crates/evidence-search-contracts",
  "crates/evidence-search-core",
  "crates/searchright",
  "crates/searchright-agent",
  "crates/searchright-access",
  "crates/searchright-assurance",
  "crates/searchright-bench",
  "crates/searchright-cli",
  "crates/searchright-connectors",
  "crates/searchright-citeweft",
  "crates/searchright-contracts",
  "crates/searchright-dedup",
  "crates/searchright-diagnostics",
  "crates/searchright-discovery",
  "crates/searchright-governance",
  "crates/searchright-interchange",
  "crates/searchright-living",
  "crates/searchright-licensed",
  "crates/searchright-mcp",
  "crates/searchright-policy",
  "crates/searchright-ops",
  "crates/searchright-plugin-sdk",
  "crates/searchright-prisma",
  "crates/searchright-provenance",
  "crates/searchright-ranking",
  "crates/searchright-screening",
  "crates/searchright-store",
  "crates/searchright-sourceright-compat",
  "crates/searchright-study",
  "crates/searchright-validation",
]
exclude = ["fuzz"]

default-members = [
  "crates/searchright",
  "crates/searchright-cli",
  "crates/searchright-mcp",
]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.97.1"
authors = ["Dylan Mordaunt"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/edithatogo/searchright"
homepage = "https://edithatogo.github.io/searchright/"
documentation = "https://edithatogo.github.io/searchright/"
readme = "README.md"
keywords = ["systematic-review", "literature-search", "prisma", "mcp", "evidence-synthesis"]
categories = ["command-line-utilities", "science", "text-processing"]

[workspace.dependencies]
citeweft = { version = "0.1.0", git = "https://github.com/edithatogo/citeweft.git", rev = "8c8932976250f9ca91c2bbda28ed68eeb191fa42" }
anyhow = "1.0"
async-trait = "0.1.89"
base64 = "0.23"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive", "env", "unicode", "wrap_help"] }
futures = "0.3"
indexmap = { version = "2.12", features = ["serde"] }
loom = "0.7.2"
proptest = "1.8"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls", "http2", "charset"] }
rmcp = { version = "3.1.0", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
sha2 = "0.11"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "io-std", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.18", features = ["serde", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_lifetimes = "deny"
unused_qualifications = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
expect_used = "deny"
indexing_slicing = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
# Public conversion and provider entry points mirror stable contract payloads.
too_many_arguments = "allow"
# MCP handlers intentionally keep receiver-shaped signatures for macro registration.
unused_self = "allow"
# Small test and error adapters preserve owned call-site signatures.
needless_pass_by_value = "allow"
# Explicit branching is clearer for review-policy state machines.
option_if_let_else = "allow"
# Platform-neutral durability adapters retain a shared Result signature.
unnecessary_wraps = "allow"
# Digest and query builders favour the locally auditable representation.
format_collect = "allow"
format_push_string = "allow"
# Eager numeric fallbacks here are pure constants and allocation-free.
or_fun_call = "allow"
# These APIs already return Result, whose value carries the use obligation.
double_must_use = "allow"
# Linear cache-write scopes make the bounded execution path explicit.
useless_let_if_seq = "allow"
# Canonical JSON is shared only inside its private audit module.
redundant_pub_crate = "allow"
# Contract DTOs intentionally group independent policy switches.
struct_excessive_bools = "allow"
# Stable serialized schema field names often repeat their enclosing noun.
struct_field_names = "allow"
# Invariant validators stay linear so every fail-closed check remains auditable.
too_many_lines = "allow"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
