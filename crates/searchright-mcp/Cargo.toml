[package]
name = "searchright-mcp"
description = "Model Context Protocol server for Searchright."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
remote-http = [
  "dep:axum",
  "dep:blake3",
  "dep:jsonwebtoken",
  "dep:searchright-access",
  "dep:searchright-contracts",
  "dep:tokio-util",
  "rmcp/transport-streamable-http-server",
]

[[bin]]
name = "searchright-mcp"
path = "src/main.rs"

[[bin]]
name = "searchright-mcp-http"
path = "src/bin/searchright-mcp-http.rs"
required-features = ["remote-http"]

[dependencies]
anyhow.workspace = true
axum = { workspace = true, optional = true }
blake3 = { workspace = true, optional = true }
base64.workspace = true
jsonwebtoken = { workspace = true, optional = true }
rmcp.workspace = true
searchright = { path = "../searchright", version = "=0.1.0-alpha.1" }
searchright-access = { path = "../searchright-access", version = "=0.1.0-alpha.1", optional = true }
searchright-contracts = { path = "../searchright-contracts", version = "=0.1.0-alpha.1", optional = true }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
time.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, optional = true }
tracing-subscriber.workspace = true
thiserror.workspace = true

[lints]
workspace = true
