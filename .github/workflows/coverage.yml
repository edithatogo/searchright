name: Coverage
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  llvm-cov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install 1.97.1 --profile minimal --component llvm-tools-preview
      - run: cargo install cargo-llvm-cov --version 0.8.7 --locked
      - run: cargo llvm-cov --workspace --all-features --locked --lcov --output-path lcov.info --fail-under-lines 91
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-lcov
          path: lcov.info
