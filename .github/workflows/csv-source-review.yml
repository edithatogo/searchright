name: CSV dependency source identity

on:
  pull_request:

permissions:
  contents: read

jobs:
  source-identity:
    name: Published CSV dependency source identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify published archives and report source identities
        run: |
          python3 - <<'PY'
          import hashlib
          import io
          import json
          import tarfile
          import urllib.request

          packages = [
              ("csv", "1.4.0", "52cd9d68cf7efc6ddfaaee42e7288d3a99d613d4b50f76ce9827ae0c6e14f938"),
              ("csv-core", "0.1.13", "704a3c26996a80471189265814dbc2c257598b96b8a7feae2d31ace646bb9782"),
              ("ryu", "1.0.23", "9774ba4a74de5f7b1c1451ed6cd5285a32eddb5cccb8cc655a4e50009e06477f"),
          ]
          for name, version, expected in packages:
              url = f"https://static.crates.io/crates/{name}/{name}-{version}.crate"
              with urllib.request.urlopen(url, timeout=30) as response:
                  archive = response.read()
              observed = hashlib.sha256(archive).hexdigest()
              if observed != expected:
                  raise SystemExit(f"archive checksum mismatch: {name}")
              files = {}
              manifests = {}
              with tarfile.open(fileobj=io.BytesIO(archive), mode="r:gz") as package:
                  for member in package.getmembers():
                      if not member.isfile():
                          continue
                      relative = member.name.split("/", 1)[1]
                      content = package.extractfile(member).read()
                      files[relative] = hashlib.sha256(content).hexdigest()
                      if relative in ("Cargo.toml", "Cargo.toml.orig", ".cargo_vcs_info.json"):
                          manifests[relative] = content.decode("utf-8")
              print("SOURCE_IDENTITY " + json.dumps({
                  "name": name, "version": version, "archive_sha256": observed,
                  "files": files, "manifests": manifests,
              }, sort_keys=True))
          PY
