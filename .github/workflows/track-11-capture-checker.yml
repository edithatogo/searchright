name: Track 11 capture reconciled checker

on:
  push:
    branches:
      - codex/track-11-agent-panel-governance

permissions:
  contents: write

jobs:
  capture:
    if: ${{ !contains(github.event.head_commit.message, '[skip track11 capture]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Execute the reconciler embedded in the one-shot workflow
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          import yaml

          workflow = yaml.safe_load(
              Path('.github/workflows/track-11-agent-panel-regenerate.yml').read_text(encoding='utf-8')
          )
          steps = workflow['jobs']['regenerate-and-verify']['steps']
          script = next(
              step['run']
              for step in steps
              if step.get('name') == 'Reconcile the skill checker with the governance decision'
          )
          subprocess.run(['bash', '-euo', 'pipefail', '-c', script], check=True)
          PY
      - name: Commit reconciled checker for inspection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check_agent_skill.py
          git commit -m "chore(11): capture reconciled skill checker [skip track11 regen] [skip track11 capture]"
          git push origin HEAD:codex/track-11-agent-panel-governance
