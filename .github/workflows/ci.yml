name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contracts:
    name: Static contracts and roadmap evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements/validation.txt
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements/validation.txt
      - name: Run complete network-free static harness
        # Installation is separate from the network-free validation gate.
        run: |
          npm ci --prefix requirements/bindings --ignore-scripts --no-audit --no-fund
          python -m unittest discover -s tests
          python scripts/run_static_harness.py


  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and components
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1
      - name: Require committed lockfile
        shell: bash
        run: test -f Cargo.lock
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all targets and features
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run unit and integration tests
        run: cargo test --workspace --all-features --locked
      - name: Verify compiled canonical-schema drift baseline
        run: python scripts/check_rust_schema_parity.py --check
      - name: Exercise built and installed CLI distribution contract
        shell: bash
        run: |
          cargo build --locked -p searchright-cli
          python scripts/check_cli_distribution.py target/debug/searchright
          cargo install --path crates/searchright-cli --locked --root "$RUNNER_TEMP/searchright-install"
          python scripts/check_cli_distribution.py "$RUNNER_TEMP/searchright-install/bin/searchright"
      - name: Run documentation tests
        run: cargo test --workspace --all-features --doc --locked
      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps --locked

  msrv:
    name: Declared Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install declared Rust version
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Check all targets
        run: cargo +1.97.1 check --workspace --all-targets --all-features --locked
