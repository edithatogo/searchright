name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rust-supply-chain:
    name: Rust supply-chain policy
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Fetch the committed dependency graph
        # Reject manifest/lock drift before policy tools can resolve another graph.
        run: cargo fetch --locked
      - name: Identify security-tool cache environment
        id: security-tools-environment
        run: |
          printf 'image=%s-%s\n' "${ImageOS:?}" "${ImageVersion:?}" >> "$GITHUB_OUTPUT"
          printf 'SEARCHRIGHT_TOOL_ROOT=%s/searchright-security-tools\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Restore pinned security tools
        id: security-tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          # Only binaries are reusable. Never cache credentials, advisory data,
          # dependency audits, workspace artefacts or successful gate results.
          path: |
            ${{ env.SEARCHRIGHT_TOOL_ROOT }}/bin/cargo-deny
            ${{ env.SEARCHRIGHT_TOOL_ROOT }}/bin/cargo-audit
            ${{ env.SEARCHRIGHT_TOOL_ROOT }}/bin/cargo-machete
            ${{ env.SEARCHRIGHT_TOOL_ROOT }}/bin/cargo-vet
          key: security-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.security-tools-environment.outputs.image }}-${{ hashFiles('rust-toolchain.toml', 'requirements/rust-tools.json', '.github/workflows/security.yml') }}
      - name: Install cargo-deny
        if: steps.security-tools-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --version 0.19.9 --locked --force --root "$SEARCHRIGHT_TOOL_ROOT"
      - name: Install cargo-audit
        if: steps.security-tools-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.2 --locked --force --root "$SEARCHRIGHT_TOOL_ROOT"
      - name: Install cargo-machete
        if: steps.security-tools-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-machete --version 0.9.2 --locked --force --root "$SEARCHRIGHT_TOOL_ROOT"
      - name: Install cargo-vet
        if: steps.security-tools-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-vet --version 0.10.2 --locked --force --root "$SEARCHRIGHT_TOOL_ROOT"
      - name: Verify installed security-tool versions
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          manifest = json.loads(Path("requirements/rust-tools.json").read_text())
          versions = {tool["crate"]: tool["version"] for tool in manifest["tools"]}
          root = Path(os.environ["SEARCHRIGHT_TOOL_ROOT"]) / "bin"
          for crate in ("cargo-deny", "cargo-audit", "cargo-machete", "cargo-vet"):
              executable = root / crate
              if not executable.is_file():
                  raise SystemExit(f"{crate} is missing from the dedicated tool directory")
              command = [str(executable), crate.removeprefix("cargo-"), "--version"]
              if crate == "cargo-machete":
                  # Machete selects Cargo-style arguments from the environment.
                  command = ["env", "-u", "CARGO", "-u", "CARGO_PKG_NAME", str(executable), "--version"]
              output = subprocess.check_output(command, text=True).strip()
              if not output or output.split()[-1] != versions[crate]:
                  raise SystemExit(f"{crate}: expected {versions[crate]}, observed {output!r}")
              print(f"{crate}: {output}")
          PY
      - name: Enforce dependency policy
        run: '"$SEARCHRIGHT_TOOL_ROOT/bin/cargo-deny" deny check'
      - name: Audit advisories
        run: '"$SEARCHRIGHT_TOOL_ROOT/bin/cargo-audit" audit --deny warnings'
      - name: Detect unused dependencies
        run: 'env -u CARGO -u CARGO_PKG_NAME "$SEARCHRIGHT_TOOL_ROOT/bin/cargo-machete"'
      - name: Validate cargo-vet trust governance
        run: |
          python scripts/test_cargo_vet_governance.py
          python scripts/check_cargo_vet_governance.py
      - name: Enforce trusted dependency audit policy
        run: CARGO="$(command -v cargo)" "$SEARCHRIGHT_TOOL_ROOT/bin/cargo-vet" vet --locked --no-minimize-exemptions
      - name: Save verified security tools from main
        if: >-
          success() && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'schedule') &&
          steps.security-tools-cache.outputs.cache-primary-key != '' &&
          steps.security-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: |
            ${{ env.SEARCHRIGHT_TOOL_ROOT }}/bin/cargo-deny
            ${{ env.SEARCHRIGHT_TOOL_ROOT }}/bin/cargo-audit
            ${{ env.SEARCHRIGHT_TOOL_ROOT }}/bin/cargo-machete
            ${{ env.SEARCHRIGHT_TOOL_ROOT }}/bin/cargo-vet
          key: ${{ steps.security-tools-cache.outputs.cache-primary-key }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialise CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: rust,python
      - name: Autobuild
        uses: github/codeql-action/autobuild@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
      - name: Analyse
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4

  scorecard:
    name: OpenSSF Scorecard
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: scorecard.sarif

  workflow-security:
    name: Workflow policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan workflows with zizmor
        run: pipx run --spec zizmor==1.26.1 zizmor --min-severity medium .github/workflows
