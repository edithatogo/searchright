name: Export CHHHS PR 679 patch

on:
  push:
    branches: [scratch/apply-chhhs-679-clean]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Concatenate patch fragments
        shell: bash
        run: |
          set -euo pipefail
          cat .github/chhhs-679-patch/part-* > "$RUNNER_TEMP/chhhs-679.patch"
          wc -l -c "$RUNNER_TEMP/chhhs-679.patch"
      - name: Upload patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chhhs-679-concatenated-patch
          path: ${{ runner.temp }}/chhhs-679.patch
          if-no-files-found: error
          retention-days: 1
