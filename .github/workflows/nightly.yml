name: Nightly robustness
on:
  schedule:
    - cron: '41 4 * * 2'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: cargo install cargo-mutants --version 27.1.0 --locked
      - run: cargo mutants --workspace --timeout 120 --jobs 2
  nightly-toolchain:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo +nightly check --workspace --all-targets --all-features
