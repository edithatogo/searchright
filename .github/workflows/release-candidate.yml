name: Release-candidate rehearsal

on:
  workflow_dispatch:
    inputs:
      execute_compiler_gates:
        description: 'Run compiler-backed release-candidate gates'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Release-candidate contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate rehearsal, roadmap and maturity dossier
        run: |
          python scripts/check_release_rehearsal.py
          python scripts/check_roadmap_coverage.py
          python scripts/check_maturity_dossier.py
          python scripts/run_static_harness.py > verification/receipts/release-candidate-static.json
      - name: Upload static receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-static-receipt
          path: verification/receipts/release-candidate-static.json
          if-no-files-found: error
          retention-days: 90

  compiler:
    name: Release-candidate compiler gates
    if: ${{ inputs.execute_compiler_gates }}
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require committed lockfile
        run: test -f Cargo.lock
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy
      - name: Run locked release gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          cargo package --workspace --locked
