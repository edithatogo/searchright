name: Integration drift surveillance

on:
  schedule:
    - cron: '19 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Read-only integration revision drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate consumer contract suite
        run: python scripts/check_consumer_contracts.py
      - name: Check exact integration pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/check_integration_drift.py
          --live
          --receipt verification/receipts/integration-drift-live.json
      - name: Preserve drift evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-drift-receipt
          path: verification/receipts/integration-drift-live.json
          if-no-files-found: warn
          retention-days: 30
