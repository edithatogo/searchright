name: Fuzzing

on:
  schedule:
    - cron: '11 1 * * 6'
  workflow_dispatch:
  pull_request:
    paths:
      - 'fuzz/**'
      - 'crates/evidence-search-core/**'
      - 'crates/searchright-contracts/**'
      - '.github/workflows/fuzz.yml'

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: fuzz-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        target: [query_contract, document_evidence, audit_event]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Run bounded fuzz target
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=300 -timeout=10
      - name: Preserve corpora and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ matrix.target }}
          path: |
            fuzz/corpus/${{ matrix.target }}
            fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: warn
          retention-days: 30
