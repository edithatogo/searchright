name: Cargo lock candidate (read-only, temporary)

on:
  pull_request:
    paths:
      - '.github/workflows/cargo-lock-candidate.yml'

permissions:
  contents: read

jobs:
  regenerate-url:
    name: Generate verified URL lockfile candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select repository toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Generate pinned patched Cargo.lock diff without external writes
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.97.1 update -p url --precise 2.5.9
          cargo +1.97.1 metadata --locked --format-version 1 --no-deps > /dev/null
          echo __SEARCHRIGHT_LOCK_DIFF_START__
          git diff -- Cargo.lock
          echo __SEARCHRIGHT_LOCK_DIFF_END__
