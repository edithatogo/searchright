name: Track 11 finalize agent-panel governance

on:
  push:
    branches:
      - codex/track-11-agent-panel-governance

permissions:
  contents: write

concurrency:
  group: track-11-agent-panel-finalize
  cancel-in-progress: true

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[skip track11 finalize]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements/validation.txt
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements/validation.txt
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1
      - name: Remove one-shot orchestration and diagnostics
        run: |
          rm -f \
            .github/workflows/track-11-agent-panel-regenerate.yml \
            .github/workflows/track-11-capture-checker.yml \
            .github/workflows/track-11-diagnose.yml \
            .github/workflows/track-11-finalize.yml \
            track11-diagnostic.txt \
            track11-test-diagnostic.txt
      - name: Regenerate bound skill and source evidence
        run: |
          python scripts/check_agent_skill.py --write
          python scripts/generate_source_hash_manifest.py
      - name: Verify agent governance and static harness
        run: |
          npm ci --prefix requirements/bindings --ignore-scripts --no-audit --no-fund
          python scripts/test_agent_panel_governance.py
          python scripts/check_agent_skill.py
          python scripts/generate_source_hash_manifest.py --check
          python scripts/run_static_harness.py
      - name: Verify Rust formatting and skill runtime
        run: |
          cargo fmt --all -- --check
          cargo test -p searchright-agent --locked
          cargo clippy -p searchright-agent --all-targets --all-features --locked -- -D warnings
      - name: Commit clean final tranche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "fix(11): adopt owner-adjudicated sealed agent panels [skip track11 regen] [skip track11 capture] [skip track11 diagnose] [skip track11 finalize]"
          git push origin HEAD:codex/track-11-agent-panel-governance
