name: Track 11 clean governance commit

on:
  push:
    branches:
      - codex/track-11-agent-panel-governance

permissions:
  contents: write

concurrency:
  group: track-11-agent-panel-clean-commit
  cancel-in-progress: true

jobs:
  commit:
    if: ${{ !contains(github.event.head_commit.message, '[skip track11 commit]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements/validation.txt

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements/validation.txt

      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1

      - name: Remove one-shot orchestration and diagnostics
        run: |
          rm -f \
            .github/workflows/track-11-agent-panel-regenerate.yml \
            .github/workflows/track-11-capture-checker.yml \
            .github/workflows/track-11-diagnose.yml \
            .github/workflows/track-11-finalize.yml \
            .github/workflows/track-11-regeneration-error.yml \
            .github/workflows/track-11-clean-commit.yml \
            track11-diagnostic.txt \
            track11-test-diagnostic.txt \
            track11-regeneration-error.txt

      - name: Reconcile canonical Track 11 roadmap and traceability inputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          coverage_path = root / 'conductor/roadmap-coverage.json'
          coverage = json.loads(coverage_path.read_text(encoding='utf-8'))
          entry = next(row for row in coverage['tracks'] if row['track_id'] == '11')

          downstream = (
              'Obtain downstream academic-research-skills maintainer adoption and '
              'consumer-test evidence after licence and upstream-drift review.'
          )
          panel = (
              'Run the sealed five-role agent panel, preserve first-pass findings, '
              'abstentions and dissent, and record accountable-owner adjudication.'
          )
          hosts = (
              'Re-run scenario-based agent evaluations across every supported exact '
              'host/model pair after each skill-package digest change.'
          )
          registry = (
              'Obtain explicit registry-submission authorization and an observed '
              'acceptance receipt before claiming publication.'
          )
          blockers = [downstream, panel, hosts, registry]
          entry['blockers'] = blockers
          entry['phase_3_task_count'] = len(blockers)
          entry['higher_evidence_task_order'] = blockers
          entry['closeout_gate_label'] = (
              'Close the track only when applicable downstream, host/model, sealed '
              'agent-panel, accountable-owner and registry gates are evidenced; '
              'optional external human calibration remains a separate evidence class.'
          )
          entry['claim_boundary'] = (
              'Compiler-verified local workflow, handoff and deterministic authority '
              'behaviour are established. The default internal review gate is a sealed '
              'five-role agent panel with preserved dissent and accountable-owner '
              'adjudication; it has not yet been executed for the new package digest. '
              'Agent-panel output is not independent human PRESS peer review. Exact '
              'host/model receipts were reset to pending after the package changed. '
              'Downstream adoption, runtime admission, optional external human '
              'calibration, registry authorisation and acceptance remain separate '
              'evidence and are not claimed.'
          )
          entry['updated'] = '2026-09-10'
          entry['external_approval_required'] = True

          deliverables = entry.setdefault('deliverables', [])
          for path in (
              'skills/systematic-search/references/agent-panel.md',
              'skills/systematic-search/evaluations/agent-panel-protocol.md',
              'skills/systematic-search/evaluations/agent-panel-template.json',
              'scripts/test_agent_panel_governance.py',
              'docs/adrs/0019-single-owner-agent-panel-governance.md',
          ):
              if path not in deliverables:
                  deliverables.append(path)
          checks = entry.setdefault('checks', [])
          if 'python scripts/test_agent_panel_governance.py' not in checks:
              checks.append('python scripts/test_agent_panel_governance.py')

          for gate in entry.get('gates', []):
              evidence = str(gate.get('required_evidence', '')).lower()
              gate_id = str(gate.get('id', '')).lower()
              if 'human information' in evidence or 'human-calibration' in gate_id:
                  gate['id'] = 'T11-G-AGENT-PANEL-OWNER'
                  gate['kind'] = 'human_authority'
                  gate['status'] = 'pending'
                  gate['required_evidence'] = (
                      'Digest-bound sealed responses from all required specialist-agent '
                      'roles, preserved dissent and accountable-owner adjudication; this '
                      'does not establish independent human peer review.'
                  )
                  gate['evidence'] = []

          coverage_path.write_text(
              json.dumps(coverage, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )

          overrides_path = root / 'conductor/traceability-overrides.json'
          overrides = json.loads(overrides_path.read_text(encoding='utf-8'))
          assertions = (
              overrides.setdefault('tracks', {})
              .setdefault('11', {})
              .setdefault('assertions', {})
          )
          a2 = assertions.setdefault('T11-A002', {})
          a2.update(
              {
                  'state': 'partially_implemented',
                  'mapping_confidence': 'symbol_and_gate_mapped',
                  'implementation_paths': [
                      'skills/systematic-search/workflows/systematic-review.yaml',
                      'skills/systematic-search/references/authority.md',
                      'skills/systematic-search/references/agent-panel.md',
                      'skills/systematic-search/references/failure-modes.md',
                      'skills/systematic-search/references/methodology.md',
                      'skills/systematic-search/references/tool-map.md',
                      'skills/systematic-search/evaluations/agent-panel-protocol.md',
                      'skills/systematic-search/evaluations/agent-panel-template.json',
                      'crates/searchright-agent/src/lib.rs',
                      'scripts/check_agent_skill.py',
                      'scripts/test_agent_panel_governance.py',
                  ],
                  'implementation_symbols': [
                      'searchright_agent::AgentWorkflow::systematic_search',
                      'searchright_agent::AgentWorkflow::validate',
                      'scripts/check_agent_skill.py::validate',
                  ],
                  'deterministic_tests': [
                      'python scripts/check_agent_skill.py',
                      'python scripts/test_agent_panel_governance.py',
                  ],
                  'evidence_receipts': [
                      'verification/receipts/systematic-search-skill.json',
                      'conductor/tracks/11-agentic-skill/evidence.json',
                  ],
                  'open_gates': [panel, hosts],
                  'permitted_claim': (
                      'Planning through reporting stages, a sealed five-role advisory '
                      'panel contract and owner-only consequential authority are '
                      'compiler-checked. The panel and exact host/model evaluations '
                      'remain unexecuted for the current package; independent human '
                      'peer review is not claimed.'
                  ),
              }
          )
          a4 = assertions.setdefault('T11-A004', {})
          a4.update(
              {
                  'state': 'partially_implemented',
                  'mapping_confidence': 'symbol_and_gate_mapped',
                  'implementation_paths': [
                      'skills/systematic-search/evaluations/authority-scenarios.json',
                      'skills/systematic-search/evaluations/agent-panel-protocol.md',
                      'skills/systematic-search/evaluations/agent-panel-template.json',
                      'scripts/test_agent_panel_governance.py',
                      'crates/searchright-agent/tests/skill_scenarios.rs',
                      'crates/searchright-agent/src/lib.rs',
                  ],
                  'implementation_symbols': [
                      'searchright_agent::evaluate_operation',
                      'skill_scenarios::deterministic_authority_scenarios_match_the_real_evaluator',
                  ],
                  'deterministic_tests': [
                      'python scripts/check_agent_skill.py',
                      'python scripts/test_agent_panel_governance.py',
                  ],
                  'evidence_receipts': [
                      'verification/receipts/systematic-search-skill.json',
                      'conductor/tracks/11-agentic-skill/evidence.json',
                  ],
                  'open_gates': [hosts, panel],
                  'permitted_claim': (
                      'Deterministic fixtures and governance tests cover authority, '
                      'panel isolation, dissent and claim boundaries. They do not '
                      'establish current host/model behaviour, panel completion or '
                      'methodological validity.'
                  ),
              }
          )
          overrides_path.write_text(
              json.dumps(overrides, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Regenerate derived Conductor and skill evidence
        run: |
          python scripts/check_agent_skill.py --write
          python scripts/sync_track_evidence.py
          python scripts/sync_traceability.py
          python scripts/render_github_issues.py
          python scripts/generate_evidence_debt.py
          python scripts/check_gate_catalog.py
          python scripts/generate_source_hash_manifest.py

      - name: Verify focused governance, projections and workflow policy
        run: |
          python scripts/test_agent_panel_governance.py
          python scripts/check_agent_skill.py
          python scripts/sync_track_evidence.py --check
          python scripts/sync_traceability.py --check
          python scripts/render_github_issues.py --check
          python scripts/generate_evidence_debt.py --check
          python scripts/check_gate_catalog.py --check
          python scripts/check_github_issue_hierarchy.py
          python scripts/check_github_project.py
          python scripts/check_workflow_hardening.py
          python scripts/generate_source_hash_manifest.py --check

      - name: Verify Rust formatting and agent runtime
        run: |
          cargo fmt --all -- --check
          cargo test -p searchright-agent --locked
          cargo clippy -p searchright-agent --all-targets --all-features --locked -- -D warnings

      - name: Commit generated clean tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "fix(11): adopt owner-adjudicated sealed agent panels [skip track11 regen] [skip track11 capture] [skip track11 diagnose] [skip track11 finalize] [skip track11 error] [skip track11 commit]"
          git push origin HEAD:codex/track-11-agent-panel-governance
