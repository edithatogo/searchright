name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
  packages: write
  id-token: write
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - run: ./scripts/verify.sh
      - run: cargo package --workspace --locked
      - run: cargo publish --workspace --locked --dry-run
  build:
    needs: verify
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install 1.97.1 --profile minimal --target ${{ matrix.target }}
      - run: cargo build --release --locked -p searchright-cli -p searchright-mcp --target ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: searchright-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/searchright*
