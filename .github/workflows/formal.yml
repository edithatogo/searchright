name: Formal and adversarial assurance

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/searchright-assurance/**'
      - 'crates/searchright-contracts/**'
      - '.github/workflows/formal.yml'
  push:
    branches: [main]
  schedule:
    - cron: '23 2 * * 4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  loom:
    name: Loom concurrency permutations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Exercise single-writer authority model
        run: cargo test -p searchright-assurance --test loom_authority --locked

  miri:
    name: Miri undefined-behaviour probe
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nightly Miri
        run: rustup toolchain install nightly --profile minimal --component miri
      - name: Prepare Miri
        run: cargo +nightly miri setup
      - name: Run bounded Miri suite
        run: cargo +nightly miri test -p searchright-assurance --lib --locked

  careful:
    name: Standard-library precondition checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nightly Rust and sources
        run: rustup toolchain install nightly --profile minimal --component rust-src
      - name: Install cargo-careful
        run: cargo install cargo-careful --version 0.4.10 --locked
      - name: Run bounded careful suite
        run: cargo +nightly careful test -p searchright-assurance --lib --locked

  kani:
    name: Kani authority proofs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare Kani compiler compatibility overlay
        run: |
          # Kani 0.67.0 bundles rustc 1.93.0-nightly. The overlay changes only
          # Cargo's admission metadata in this disposable checkout; the proof
          # still compiles and verifies the exact committed Rust source. This
          # job is not evidence for MSRV or the exact committed Cargo metadata.
          test "$(grep -c '^rust-version = "1.97.1"$' Cargo.toml)" -eq 1
          sed -i 's/rust-version = "1.97.1"/rust-version = "1.93"/' Cargo.toml
          test "$(grep -c '^rust-version = "1.93"$' Cargo.toml)" -eq 1
      - name: Verify finite authority invariants
        uses: model-checking/kani-github-action@2534b7aeb3c6b4b0a5ecc3981bb3e63d47b5b126 # v1
        with:
          kani-version: '0.67.0'
          command: cargo-kani
          args: '-p searchright-assurance'
