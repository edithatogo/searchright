name: Conductor issue hierarchy

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Create/update GitHub issues and native subissues'
        required: true
        type: boolean
        default: false
      repository:
        description: 'Exact owner/name repository; must match generated hierarchy'
        required: true
        type: string
        default: 'edithatogo/searchright'

permissions:
  contents: read

jobs:
  dry-run:
    name: Render and dry-run issue hierarchy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify generated issue hierarchy
        run: |
          python scripts/render_github_issues.py --check
          python scripts/check_github_issue_hierarchy.py
      - name: Print mutation-free sync plan
        run: >-
          python scripts/sync_github_issues.py
          --repo '${{ inputs.repository }}'

  apply:
    name: Explicit issue/subissue apply
    if: ${{ inputs.apply && github.ref == 'refs/heads/main' }}
    needs: dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: github-issue-write
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Apply idempotent issue and native subissue hierarchy
        env:
          GH_TOKEN: ${{ github.token }}
          SEARCHRIGHT_GITHUB_APPLY: '1'
        run: >-
          python scripts/sync_github_issues.py
          --repo '${{ inputs.repository }}'
          --apply
          --receipt-path verification/receipts/github-issue-sync.json
      - name: Preserve apply receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-issue-sync-receipt
          path: verification/receipts/github-issue-sync.json
          if-no-files-found: error
          retention-days: 90
