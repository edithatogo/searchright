name: Track 11 agent-panel governance regeneration

on:
  push:
    branches:
      - codex/track-11-agent-panel-governance

permissions:
  contents: write

concurrency:
  group: track-11-agent-panel-governance
  cancel-in-progress: true

jobs:
  regenerate-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[skip track11 regen]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements/validation.txt

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements/validation.txt

      - name: Reconcile the skill checker with the governance decision
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/check_agent_skill.py")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one checker fragment, found {count}: {old[:80]!r}")
              text = text.replace(old, new)

          replace_once(
              'HUMAN_TEMPLATE = SKILL_ROOT / "evaluations" / "human-calibration-template.json"\nCALLER =',
              'HUMAN_TEMPLATE = SKILL_ROOT / "evaluations" / "human-calibration-template.json"\n'
              'AGENT_PANEL_PROTOCOL = SKILL_ROOT / "evaluations" / "agent-panel-protocol.md"\n'
              'AGENT_PANEL_TEMPLATE = SKILL_ROOT / "evaluations" / "agent-panel-template.json"\n'
              'CALLER =',
          )
          replace_once(
              'REQUIRED_REFERENCES = [\n    "authority.md",',
              'REQUIRED_REFERENCES = [\n    "authority.md",\n    "agent-panel.md",',
          )
          replace_once(
              '    for phrase in ("telemetry disabled", "credentials", "full text", "explicit allowlist"):\n'
              '        if phrase.lower() not in skill_text.lower():\n'
              '            errors.append(f"portable skill lacks data boundary phrase {phrase!r}")\n',
              '    for phrase in ("telemetry disabled", "credentials", "full text", "explicit allowlist"):\n'
              '        if phrase.lower() not in skill_text.lower():\n'
              '            errors.append(f"portable skill lacks data boundary phrase {phrase!r}")\n'
              '    governance_text = re.sub(r"\\s+", " ", skill_text.lower())\n'
              '    for phrase in (\n'
              '        "single accountable human-owner",\n'
              '        "sealed panel",\n'
              '        "preserves individual findings, abstentions and dissent",\n'
              '        "it is not independent human press peer review",\n'
              '    ):\n'
              '        if phrase not in governance_text:\n'
              '            errors.append(f"skill lacks single-owner agent-panel boundary {phrase!r}")\n'
              '    obsolete = (\n'
              '        "a human information specialist should review",\n'
              '        "two reviewers/adjudicator as protocolled",\n'
              '    )\n'
              '    authority_text = (SKILL_ROOT / "references" / "authority.md").read_text(encoding="utf-8")\n'
              '    for phrase in obsolete:\n'
              '        if phrase.lower() in (skill_text + "\\n" + authority_text).lower():\n'
              '            errors.append(f"obsolete mandatory second-human wording remains: {phrase!r}")\n',
          )
          replace_once(
              '        "review_plan_approval",\n        "strategy_and_press_approval",',
              '        "review_plan_approval",\n        "agent_panel_adjudication",\n        "strategy_and_press_approval",',
          )
          replace_once(
              '    if press.get("isolation") != "independent_context":\n'
              '        errors.append("PRESS stage must use independent context")\n',
              '    if workflow.get("accountable_owner_model") != "single_human_owner":\n'
              '        errors.append("workflow must declare the single accountable owner model")\n'
              '    if press.get("review_model") != "owner_adjudicated_agent_panel":\n'
              '        errors.append("PRESS stage must use the owner-adjudicated agent-panel model")\n'
              '    if press.get("isolation") != "sealed_first_passes":\n'
              '        errors.append("PRESS stage must use sealed first-pass isolation")\n'
              '    if press.get("authority") != "advisory_only":\n'
              '        errors.append("PRESS agent panel must remain advisory only")\n'
              '    expected_panel_roles = [\n'
              '        "methodology",\n'
              '        "information_retrieval",\n'
              '        "implementation_testing",\n'
              '        "security_privacy_rights",\n'
              '        "adversarial_replication",\n'
              '    ]\n'
              '    if press.get("panel_roles") != expected_panel_roles:\n'
              '        errors.append("PRESS stage must retain all five sealed panel roles")\n'
              '    if press.get("claim_boundary") != "agent_panel_is_not_independent_human_peer_review":\n'
              '        errors.append("PRESS stage must deny an independent-human-review claim")\n',
          )
          replace_once(
              '    if live_mode.get("network") is not True or live_mode.get("requires") != [\n'
              '        "strategy_and_press_approval",\n'
              '        "live_execution_approval",\n'
              '    ]:\n'
              '        errors.append("live execution must require strategy/PRESS and live-execution approvals")\n',
              '    if live_mode.get("network") is not True or live_mode.get("requires") != [\n'
              '        "agent_panel_adjudication",\n'
              '        "strategy_and_press_approval",\n'
              '        "live_execution_approval",\n'
              '    ]:\n'
              '        errors.append("live execution must require panel adjudication, strategy and live approvals")\n',
          )
          replace_once(
              '    if screen.get("authority") != "advisory_only":\n'
              '        errors.append("screening assistant must remain advisory only")\n',
              '    if screen.get("authority") != "advisory_only":\n'
              '        errors.append("screening assistant must remain advisory only")\n'
              '    if screen.get("final_decision_authority") != "accountable_owner_or_designated_human":\n'
              '        errors.append("final screening authority must remain with the owner or a designated human")\n',
          )
          replace_once(
              '    if not HUMAN_PROTOCOL.is_file():\n'
              '        errors.append("human calibration protocol is missing")\n'
              '    human_template = load_json(HUMAN_TEMPLATE)\n'
              '    if human_template.get("schema_version") != "org.searchright.agent-human-calibration.v1":\n'
              '        errors.append("unexpected human calibration template schema version")\n'
              '    if human_template.get("status") != "awaiting_independent_reviewers" or human_template.get("reviewers") != []:\n'
              '        errors.append("human calibration template must not imply unobserved review")\n',
              '    if not AGENT_PANEL_PROTOCOL.is_file():\n'
              '        errors.append("agent-panel evaluation protocol is missing")\n'
              '    panel_template = load_json(AGENT_PANEL_TEMPLATE)\n'
              '    if panel_template.get("schema_version") != "org.searchright.agent-panel-review.v1":\n'
              '        errors.append("unexpected agent-panel template schema version")\n'
              '    if panel_template.get("status") != "awaiting_panel":\n'
              '        errors.append("agent-panel template must remain awaiting_panel until executed")\n'
              '    if panel_template.get("panel_roles") != expected_panel_roles:\n'
              '        errors.append("agent-panel template must retain the five required roles")\n'
              '    if panel_template.get("responses") != [] or panel_template.get("owner_id") is not None:\n'
              '        errors.append("agent-panel template must not imply an executed panel or owner adjudication")\n'
              '    if not HUMAN_PROTOCOL.is_file():\n'
              '        errors.append("optional human calibration protocol is missing")\n'
              '    human_template = load_json(HUMAN_TEMPLATE)\n'
              '    if human_template.get("schema_version") != "org.searchright.agent-human-calibration.v1":\n'
              '        errors.append("unexpected human calibration template schema version")\n'
              '    if human_template.get("status") != "optional_not_scheduled" or human_template.get("reviewers") != []:\n'
              '        errors.append("optional human calibration template must not imply an observed or required review")\n',
          )
          replace_once(
              '        "registry_packet": "prepared_not_submitted",\n',
              '        "registry_packet": "prepared_not_submitted",\n'
              '        "review_governance": "single_accountable_owner_with_sealed_agent_panel",\n'
              '        "agent_panel_status": panel_template.get("status"),\n'
              '        "optional_human_calibration": human_template.get("status"),\n',
          )
          replace_once(
              '            "Human information-specialist calibration and downstream consumer validation remain separate evidence."\n',
              '            "Owner-adjudicated agent-panel execution, optional external human calibration and downstream consumer validation remain separate evidence."\n',
          )
          replace_once(
              '["test_agent_host_eval", "test_agent_skill_policy"]',
              '["test_agent_host_eval", "test_agent_skill_policy", "test_agent_panel_governance"]',
          )
          path.write_text(text, encoding="utf-8", newline="\n")
          PY

      - name: Remove one-shot workflow before generating evidence
        run: rm .github/workflows/track-11-agent-panel-regenerate.yml

      - name: Regenerate skill and source receipts
        run: |
          python scripts/check_agent_skill.py --write
          python scripts/generate_source_hash_manifest.py

      - name: Verify focused and aggregate static gates
        run: |
          npm ci --prefix requirements/bindings --ignore-scripts --no-audit --no-fund
          python scripts/check_agent_skill.py
          python scripts/test_agent_panel_governance.py
          python scripts/generate_source_hash_manifest.py --check
          python scripts/run_static_harness.py

      - name: Commit regenerated artefacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "fix(11): adopt owner-adjudicated sealed agent panels [skip track11 regen]"
          git push origin HEAD:codex/track-11-agent-panel-governance
