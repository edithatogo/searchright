name: Recover CHHHS payload 679 v2

on:
  push:
    branches: [scratch/recover-chhhs-payload-679-v2]

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout clean recovery branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch historical payload commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 67c10859e37e7db51bcce6c564841cdbe4e987e0
          git show 67c10859e37e7db51bcce6c564841cdbe4e987e0:.github/workflows/bootstrap-chhhs-source.yml > bootstrap-chhhs-source.yml
      - name: Recover and validate reviewed archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import io
          import json
          import re
          import tarfile
          from pathlib import Path

          lines = Path('bootstrap-chhhs-source.yml').read_text(encoding='utf-8').splitlines()
          start = next(
              index + 1
              for index, line in enumerate(lines)
              if "<<'PAYLOAD'" in line and 'chhhs-payload.b64' in line
          )
          end = next(
              index
              for index in range(start, len(lines))
              if lines[index].strip() == 'PAYLOAD'
          )
          payload_lines = [line.strip() for line in lines[start:end] if line.strip()]
          invalid = [line for line in payload_lines if re.fullmatch(r'[A-Za-z0-9+/=]+', line) is None]
          if invalid:
              raise RuntimeError(f'non-base64 payload lines found: {invalid[:3]}')
          encoded = ''.join(payload_lines)
          encoded += '=' * (-len(encoded) % 4)
          payload = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(payload).hexdigest()

          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as archive:
              inventory = []
              for member in archive.getmembers():
                  path = Path(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise RuntimeError(f'unsafe archive member: {member.name}')
                  if member.issym() or member.islnk():
                      raise RuntimeError(f'archive links are not permitted: {member.name}')
                  if member.isfile():
                      inventory.append(member.name)

          Path('recovered-chhhs-payload.tar.gz').write_bytes(payload)
          Path('recovered-chhhs-payload-inventory.json').write_text(
              json.dumps(
                  {
                      'archive_sha256': digest,
                      'encoded_length': len(encoded),
                      'file_count': len(inventory),
                      'files': sorted(inventory),
                  },
                  indent=2,
              ) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Upload recovered payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recovered-chhhs-payload-679-v2
          path: |
            recovered-chhhs-payload.tar.gz
            recovered-chhhs-payload-inventory.json
          if-no-files-found: error
          retention-days: 1
