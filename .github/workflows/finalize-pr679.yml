name: Finalize PR 679 after payload materialisation

on:
  push:
    branches: [scratch/recover-chhhs-payload-679-v2]

permissions:
  contents: write

concurrency:
  group: finalize-pr679
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout recovery controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Patch one-track admission and validate exact branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: feat/chhhs-research-intelligence-demo
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            git fetch --no-tags origin "$PR_BRANCH"
            rm -rf /tmp/pr679-final
            git worktree prune
            git worktree add /tmp/pr679-final "origin/$PR_BRANCH"
            if [[ -f /tmp/pr679-final/apps/chhhs-research-intelligence/Cargo.toml ]]; then
              break
            fi
            git worktree remove --force /tmp/pr679-final
            sleep 30
          done
          test -f /tmp/pr679-final/apps/chhhs-research-intelligence/Cargo.toml
          cd /tmp/pr679-final
          rm -f .github/workflows/bootstrap-chhhs-source.yml

          python - <<'PY'
          from pathlib import Path

          candidates = [Path('scripts/check_pr_track_scope.py')]
          candidates.extend(Path('tests').rglob('*pr*track*scope*.py'))
          changed = []
          for path in candidates:
              if not path.is_file():
                  continue
              original = path.read_text(encoding='utf-8')
              updated = original.replace('3[0-7]', '3[0-8]').replace('00-37', '00-38')
              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))
          print({'patched': changed})
          PY

          python scripts/generate_source_hash_manifest.py
          python scripts/check_chhhs_research_demo.py
          python scripts/check_traceability.py
          python scripts/check_roadmap_coverage.py
          python scripts/validate_repository.py
          python scripts/run_static_harness.py
          cargo fmt --all -- --check
          cargo test --workspace --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No finalization changes required.'
            exit 0
          fi
          git commit -m 'fix(ci): admit Track 38 and refresh generated evidence'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${PR_BRANCH}"
