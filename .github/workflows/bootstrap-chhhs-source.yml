name: Apply CHHHS demonstration payload

on:
  push:
    branches: [feat/chhhs-research-intelligence-demo]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Apply reviewed payload and commit
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/chhhs-payload.b64" <<'PAYLOAD'
[...truncated for display...]
PAYLOAD
          base64 -d "$RUNNER_TEMP/chhhs-payload.b64" > "$RUNNER_TEMP/chhhs-payload.tar.gz"
          tar -xzf "$RUNNER_TEMP/chhhs-payload.tar.gz" -C "$GITHUB_WORKSPACE"
          rm -f .github/workflows/bootstrap-chhhs-source.yml
          python scripts/check_chhhs_research_demo.py
          python scripts/check_traceability.py
          python scripts/check_roadmap_coverage.py
          python scripts/validate_repository.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(pilot): add CHHHS research-intelligence demo (Track 38)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
