name: Apply CHHHS PR 679 patch

on:
  push:
    branches: [scratch/apply-chhhs-679-clean]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Install pinned toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          python -m pip install --disable-pip-version-check -r requirements/validation.txt
          npm ci --prefix requirements/bindings --ignore-scripts --no-audit --no-fund
      - name: Apply reviewed source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/chhhs-679-patch/part-* > "$RUNNER_TEMP/chhhs-679.full.patch"
          head -n 5160 "$RUNNER_TEMP/chhhs-679.full.patch" > "$RUNNER_TEMP/chhhs-679.source.patch"
          git apply --check "$RUNNER_TEMP/chhhs-679.source.patch"
          git apply "$RUNNER_TEMP/chhhs-679.source.patch"
          rm -rf .github/chhhs-679-patch
          rm -f .github/workflows/apply-chhhs-679-patch.yml
          rm -f .github/workflows/export-chhhs-679-patch.yml
      - name: Format and regenerate derived integrity artefacts
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          python scripts/sync_context_lock.py
          python scripts/generate_evidence_debt.py
          python scripts/generate_source_sbom.py
          python scripts/generate_source_hash_manifest.py
      - name: Run pre-commit source checks
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_chhhs_research_demo.py
          python -m unittest discover -s tests
          python scripts/check_workflow_hardening.py
          python scripts/validate_repository.py
          cargo fmt --all -- --check
          git diff --check
      - name: Create locally verified candidate commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(pilot): add CHHHS research intelligence demo (Track 36)"
          test -z "$(git status --porcelain)"
      - name: Verify clean candidate before remote push
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_static_harness.py
          cargo test -p searchright-chhhs-demo --all-features --locked
          cargo clippy -p searchright-chhhs-demo --all-targets --all-features --locked -- -D warnings
          cargo fmt --all -- --check
          git diff --check HEAD^
          test -z "$(git status --porcelain)"
      - name: Push verified candidate
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:${GITHUB_REF_NAME}"
