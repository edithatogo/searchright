name: Apply CHHHS PR 679 patch

on:
  push:
    branches: [scratch/apply-chhhs-679-clean]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Install pinned toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          python -m pip install --disable-pip-version-check -r requirements/validation.txt
          npm ci --prefix requirements/bindings --ignore-scripts --no-audit --no-fund
      - name: Apply reviewed source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/chhhs-679-patch/part-* > "$RUNNER_TEMP/chhhs-679.full.patch"
          head -n 5160 "$RUNNER_TEMP/chhhs-679.full.patch" > "$RUNNER_TEMP/chhhs-679.source.patch"
          git apply --check "$RUNNER_TEMP/chhhs-679.source.patch"
          git apply "$RUNNER_TEMP/chhhs-679.source.patch"
          rm -rf .github/chhhs-679-patch
          rm -f .github/workflows/apply-chhhs-679-patch.yml
          rm -f .github/workflows/export-chhhs-679-patch.yml
      - name: Apply compiler-discovered corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          attribution = Path('crates/searchright-chhhs-demo/src/attribution.rs')
          text = attribution.read_text(encoding='utf-8')
          old = 'use std::collections::BTreeSet;\n\n'
          if old not in text:
              raise SystemExit('expected unused BTreeSet import was not found')
          attribution.write_text(text.replace(old, '', 1), encoding='utf-8')

          model = Path('crates/searchright-chhhs-demo/src/model.rs')
          text = model.read_text(encoding='utf-8')
          old = '''pub fn normalise_text(value: &str) -> String {
    value
        .chars()
        .map(|character| {
            if character.is_alphanumeric() {
                character.to_ascii_lowercase()
            } else {
                ' '
            }
        })
        .collect::<String>()
        .split_whitespace()
        .collect::<Vec<_>>()
        .join(" ")
}'''
          new = '''pub fn normalise_text(value: &str) -> String {
    let mut normalised = String::with_capacity(value.len());
    for character in value.chars() {
        if character == '&' {
            normalised.push_str(" and ");
        } else if character.is_alphanumeric() {
            normalised.extend(character.to_lowercase());
        } else {
            normalised.push(' ');
        }
    }
    normalised
        .split_whitespace()
        .collect::<Vec<_>>()
        .join(" ")
}'''
          if old not in text:
              raise SystemExit('expected normalise_text implementation was not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              '            "cairns hinterland hhs"\n',
              '            "cairns and hinterland hhs"\n',
              1,
          )
          model.write_text(text, encoding='utf-8')

          fixture = Path('crates/searchright-chhhs-demo/fixtures/europe-pmc.json')
          payload = json.loads(fixture.read_text(encoding='utf-8'))
          rows = payload['resultList']['result']
          for row in rows:
              row['source'] = 'MED'
          fixture.write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')

          taxonomy_path = Path('crates/searchright-chhhs-demo/resources/research-taxonomy.json')
          taxonomy = json.loads(taxonomy_path.read_text(encoding='utf-8'))
          redundant = {
              'systematic-review': {'meta-analysis'},
              'case-control-study': {'case-control'},
              'cross-sectional-study': {'cross-sectional'},
              'modelling-economic-evaluation': {'cost-effectiveness'},
          }
          removed = set()
          for rule in taxonomy['study_types']:
              excluded = redundant.get(rule['category_id'], set())
              retained = []
              for term in rule['terms']:
                  if term in excluded:
                      removed.add((rule['category_id'], term))
                  else:
                      retained.append(term)
              rule['terms'] = retained
          expected = {
              (category, term)
              for category, terms in redundant.items()
              for term in terms
          }
          if removed != expected:
              raise SystemExit(f'unexpected taxonomy correction set: {sorted(removed)}')
          taxonomy_path.write_text(
              json.dumps(taxonomy, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Format and regenerate derived integrity artefacts
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          python scripts/sync_context_lock.py
          python scripts/generate_evidence_debt.py
          python scripts/generate_source_sbom.py
      - name: Run pre-commit source checks
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_chhhs_research_demo.py
          python -m unittest discover -s tests
          python scripts/check_workflow_hardening.py
          python scripts/validate_repository.py
          cargo fmt --all -- --check
          git diff --check
      - name: Create manifest-complete candidate commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          python scripts/generate_source_hash_manifest.py
          git add verification/receipts/source-manifest.sha256
          git commit -m "feat(pilot): add CHHHS research intelligence demo (Track 36)"
          test -z "$(git status --porcelain)"
      - name: Verify clean candidate before remote push
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_static_harness.py
          cargo test -p searchright-chhhs-demo --all-features --locked
          cargo clippy -p searchright-chhhs-demo --all-targets --all-features --locked -- -D warnings
          cargo fmt --all -- --check
          git diff --check HEAD^
          test -z "$(git status --porcelain)"
      - name: Push verified candidate
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:${GITHUB_REF_NAME}"
