name: Bootstrap source artifact

on:
  push:
    branches: [pilot/chhhs-research-monitor]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Package source tree
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/source-tree.tgz" HEAD
      - name: Upload source tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-tree
          path: ${{ runner.temp }}/source-tree.tgz
          if-no-files-found: error
          retention-days: 1
