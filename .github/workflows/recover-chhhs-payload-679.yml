name: Recover CHHHS payload 679

on:
  push:
    branches: [scratch/recover-chhhs-payload-679]

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Recover and validate reviewed archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import io
          import json
          import tarfile
          from pathlib import Path

          source_path = Path('.github/workflows/bootstrap-chhhs-source.yml')
          lines = source_path.read_text(encoding='utf-8').splitlines()
          marker = "          cat > \"$RUNNER_TEMP/chhhs-payload.b64\" <<'PAYLOAD'"
          try:
              start = lines.index(marker) + 1
          except ValueError as exc:
              raise RuntimeError('payload heredoc start marker not found') from exc
          try:
              end = next(index for index in range(start, len(lines)) if lines[index] == 'PAYLOAD')
          except StopIteration as exc:
              raise RuntimeError('payload heredoc end marker not found') from exc

          encoded = ''.join(line.strip() for line in lines[start:end])
          encoded += '=' * (-len(encoded) % 4)
          payload = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(payload).hexdigest()

          destination = Path('/tmp/recovered-chhhs-payload')
          destination.mkdir(parents=True, exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as archive:
              members = archive.getmembers()
              for member in members:
                  target = (destination / member.name).resolve()
                  root = destination.resolve()
                  if target != root and root not in target.parents:
                      raise RuntimeError(f'unsafe archive member: {member.name}')
                  if member.issym() or member.islnk():
                      raise RuntimeError(f'archive links are not permitted: {member.name}')
              archive.extractall(destination, filter='data')

          inventory = sorted(
              str(path.relative_to(destination))
              for path in destination.rglob('*')
              if path.is_file()
          )
          Path('/tmp/recovered-chhhs-payload-inventory.json').write_text(
              json.dumps(
                  {
                      'archive_sha256': digest,
                      'encoded_length': len(encoded),
                      'file_count': len(inventory),
                      'files': inventory,
                  },
                  indent=2,
              ) + '\n',
              encoding='utf-8',
          )
          PY
          tar -C /tmp/recovered-chhhs-payload -czf "$RUNNER_TEMP/recovered-chhhs-payload.tgz" .
          cp /tmp/recovered-chhhs-payload-inventory.json "$RUNNER_TEMP/"
      - name: Upload recovered payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recovered-chhhs-payload-679
          path: |
            ${{ runner.temp }}/recovered-chhhs-payload.tgz
            ${{ runner.temp }}/recovered-chhhs-payload-inventory.json
          if-no-files-found: error
          retention-days: 1
