[profile.default]
fail-fast = false
retries = 1
slow-timeout = { period = "60s", terminate-after = 2 }
status-level = "pass"
final-status-level = "flaky"

[profile.ci]
fail-fast = false
retries = 2
slow-timeout = { period = "90s", terminate-after = 2 }
status-level = "skip"
final-status-level = "pass"
