schema_version: org.searchright.skill-workflow.v1
name: systematic-review
handoff_contract: org.searchright.agent-handoff.v1
handoff_policy: approved_artifact_references_only
accountable_owner_model: single_human_owner
human_checkpoints:
  - review_plan_approval
  - agent_panel_adjudication
  - strategy_and_press_approval
  - live_execution_approval
  - deduplication_apply
  - screening_conflict_resolution
  - final_reporting_review
stages:
  - id: scope
    agent: question-framer
    handoff_to: information-specialist
    output: review-plan-draft.yaml
  - id: strategy
    agent: information-specialist
    handoff_to: press-reviewer
    requires: [review_plan_approval]
    output: search-strategies/
  - id: press
    agent: press-reviewer
    review_model: owner_adjudicated_agent_panel
    isolation: sealed_first_passes
    authority: advisory_only
    panel_roles:
      - methodology
      - information_retrieval
      - implementation_testing
      - security_privacy_rights
      - adversarial_replication
    requires: [review_plan_approval]
    handoff_to: execution-operator
    output: reviews/agent-panel/
    claim_boundary: agent_panel_is_not_independent_human_peer_review
  - id: execute
    agent: execution-operator
    handoff_to: dedup-adjudicator
    modes:
      fixture_replay:
        network: false
        requires: []
      live:
        network: true
        requires:
          - agent_panel_adjudication
          - strategy_and_press_approval
          - live_execution_approval
    output: source-receipts.json
  - id: deduplicate
    agent: dedup-adjudicator
    handoff_to: screening-assistant
    requires: [deduplication_apply]
    output: dedup-decisions.jsonl
  - id: screen
    agent: screening-assistant
    authority: advisory_only
    final_decision_authority: accountable_owner_or_designated_human
    handoff_to: reporting-auditor
    output: screening-recommendations.jsonl
  - id: report
    agent: reporting-auditor
    requires: [final_reporting_review]
    output: reporting-audit.json
