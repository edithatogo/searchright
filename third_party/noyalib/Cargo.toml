[package]
edition = "2024"
rust-version = "1.89.0"
name = "noyalib"
version = "0.0.58"
authors = ["Sebastien Rousseau <sebastian.rousseau@gmail.com>"]
build = "build.rs"
include = [
    "/benches/**",
    "/build.rs",
    "/Cargo.toml",
    "/examples/**",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/README.md",
    "/src/**",
    "/tests/**",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A pure Rust YAML library with zero unsafe code and full serde integration"
homepage = "https://github.com/sebastienrousseau/noyalib"
documentation = "https://docs.rs/noyalib"
readme = "README.md"
keywords = [
    "yaml",
    "serde",
    "serialization",
    "parser",
    "safe",
]
categories = [
    "encoding",
    "parser-implementations",
    "config",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sebastienrousseau/noyalib"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
arbitrary = [
    "dep:arbitrary",
    "std",
]
ariadne = ["dep:ariadne"]
compare-saphyr = ["dep:serde-saphyr"]
compat-serde-yaml = ["lossless-u64"]
default = [
    "std",
    "fast-int",
    "fast-float",
    "strict-deserialise",
]
fast-float = ["dep:ryu"]
fast-int = ["dep:itoa"]
figment = [
    "dep:figment",
    "std",
]
garde = ["dep:garde"]
include = []
include_fs = [
    "include",
    "std",
    "dep:rustix",
]
lossless-float = []
lossless-u64 = []
miette = [
    "dep:miette",
    "std",
]
minimal = ["std"]
nightly-simd = ["simd"]
noyavalidate = [
    "std",
    "miette",
    "miette/fancy",
    "validate-schema",
]
parallel = [
    "dep:rayon",
    "std",
]
recovery = ["std"]
schema = [
    "dep:schemars",
    "dep:serde_json",
]
simd = []
std = [
    "serde_core/std",
    "indexmap/std",
    "rustc-hash/std",
    "memchr/std",
]
strict-deserialise = ["dep:serde_ignored"]
sval = ["dep:sval"]
tokio = [
    "dep:tokio",
    "dep:tokio-util",
    "dep:bytes",
    "std",
]
validate-schema = [
    "schema",
    "dep:jsonschema",
]
validator = ["dep:validator"]
wasm-opt = []

